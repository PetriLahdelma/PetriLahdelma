<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="64" role="img" aria-label="Invite me to talk">
  <style>@media (max-width:120px){.arrow{display:none}}</style>
  <title>Invite me to talk</title>
  <rect width="100%" height="64" rx="6" fill="#d9c7ff" stroke="#977bbd" stroke-width="2"/>
  <text x="10" y="26" fill="#0d1117" font-family="Arial, Helvetica, sans-serif" style="font-size:clamp(10px,9vw,15px)" font-weight="600">Invite me</text>
  <text x="10" y="46" fill="#0d1117" font-family="Arial, Helvetica, sans-serif" style="font-size:clamp(10px,9vw,15px)" font-weight="600">to talk</text>
  <svg class="arrow" x="100%" width="32" height="64" overflow="visible">
    <path d="M-24 26 -14 16M-24 16h10v10" fill="none" stroke="#0d1117" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</svg>
