name: Update npm downloads badge

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-npm-downloads-badge.mjs
      - tests/npm-downloads-badge.test.mjs
      - .github/workflows/npm-downloads-badge.yml
  pull_request:
    paths:
      - scripts/update-npm-downloads-badge.mjs
      - tests/npm-downloads-badge.test.mjs
      - .github/workflows/npm-downloads-badge.yml

permissions:
  contents: read

concurrency:
  group: npm-downloads-badge-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/npm-downloads-badge.test.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Restore the latest published snapshot
        run: |
          git fetch origin codex/profile-badges:refs/remotes/origin/codex/profile-badges
          git worktree add --detach "$RUNNER_TEMP/profile-badges" refs/remotes/origin/codex/profile-badges
          cp "$RUNNER_TEMP/profile-badges/assets/badges/rhythmguard-downloads.svg" assets/badges/
          cp "$RUNNER_TEMP/profile-badges/assets/badges/rhythmguard-downloads.json" assets/badges/
      - name: Refresh from npm
        id: update
        run: node scripts/update-npm-downloads-badge.mjs
      - name: Publish the successful refresh
        if: steps.update.outputs.status == 'updated'
        run: |
          cp assets/badges/rhythmguard-downloads.svg "$RUNNER_TEMP/profile-badges/assets/badges/"
          cp assets/badges/rhythmguard-downloads.json "$RUNNER_TEMP/profile-badges/assets/badges/"
          cd "$RUNNER_TEMP/profile-badges"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/badges/rhythmguard-downloads.svg assets/badges/rhythmguard-downloads.json
          git commit -m 'Keep the profile download count aligned with npm reporting' -m 'Confidence: high' -m 'Scope-risk: narrow' -m 'Tested: Valid npm response; badge updater tests'
          git push origin HEAD:refs/heads/codex/profile-badges
